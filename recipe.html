<script>
const params = new URLSearchParams(window.location.search);
const recipeId = params.get('id');

fetch('recipes.json')
  .then(r => r.json())
  .then(data => {
    const s = data.site || {};
    applySiteInfo(s);

    const recipes = data.recipes || [];
    const recipe = recipes.find(r => r.id === recipeId);

    if (!recipe) {
      document.getElementById('recipeMain').innerHTML =
        '<div class="post-title-block"><h1>Post not found</h1><a href="recipes.html" class="back-link">← Back to all posts</a></div>';
      return;
    }

    document.title = recipe.title + ' — ' + (s.title || 'Beautiful Things');

    const others = recipes
      .filter(r => r.id !== recipe.id)
      .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))
      .slice(0, 3);

    renderRecipe(recipe, s, others);
  });

function renderRecipe(r, s, others) {
  const sectionsHtml = renderSections(r.sections || [], r);

  const tipHtml = r.tip ? `
    <div class="post-tip">
      <p class="post-tip-label">Tip</p>
      <p class="post-tip-text">${escapeHtml(r.tip)}</p>
    </div>` : '';

  const metaItems = [];
  if (r.prep_time) metaItems.push(`<span class="post-meta-item">Prep · <strong>${escapeHtml(r.prep_time)}</strong></span>`);
  if (r.cook_time) metaItems.push(`<span class="post-meta-item">Cook · <strong>${escapeHtml(r.cook_time)}</strong></span>`);
  if (r.servings) metaItems.push(`<span class="post-meta-item">Yield · <strong>${escapeHtml(r.servings)}</strong></span>`);
  const metaRow = metaItems.length ? `<div class="post-meta-row">${metaItems.join('')}</div>` : '';

  const tagsHtml = (r.tags && r.tags.length) ? `
    <div class="post-tags">
      ${r.tags.map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('')}
    </div>` : '';

  const recentHtml = others.map(o => `
    <a href="recipe.html?id=${encodeURIComponent(o.id)}" class="sidebar-recent-item">
      <div class="sidebar-recent-image">
        <img src="${escapeAttr(o.image)}" alt="${escapeAttr(o.title)}" loading="lazy">
      </div>
      <h4 class="sidebar-recent-title">${escapeHtml(o.title)}</h4>
      <p class="sidebar-recent-category">${escapeHtml((o.category || '').toUpperCase())}</p>
    </a>
  `).join('');

  const authorName = s.author || 'Beautiful Things';

  document.getElementById('recipeMain').innerHTML = `
    <div class="post-hero">
      <img src="${escapeAttr(r.image)}" alt="${escapeAttr(r.title)}">
    </div>

    <div class="post-title-block">
      <h1>${escapeHtml(r.title)}</h1>
      <div class="post-underline"></div>
      <p class="post-category">${escapeHtml((r.category || '').toUpperCase())}</p>
    </div>

    <div class="post-body">
      <article class="post-content">
        ${r.description ? `<p class="post-description">${escapeHtml(r.description)}</p>` : ''}
        ${metaRow}
        ${sectionsHtml}
        ${tipHtml}
        ${tagsHtml}

        <div style="text-align:center; margin-top:40px;">
          <a href="recipes.html" class="back-link">← Back to all posts</a>
        </div>
      </article>

      <aside class="post-sidebar">
        <p class="sidebar-author">${escapeHtml(authorName)}</p>
        <h3 class="sidebar-section-title">Most Recent Posts</h3>
        <div class="sidebar-recent">${recentHtml}</div>
      </aside>
    </div>
  `;
}

// Render flexible sections — each is one of:
// { type: "paragraph", text: "..." }
// { type: "heading", text: "..." }
// { type: "ingredients", items: [...] }
// { type: "instructions", items: [...] }
// { type: "image", src: "...", caption: "...", alt: "...", size: "normal|small|wide" }
// { type: "slideshow", photos: [{ src, caption, alt }, ...], size: "normal|small|wide" }
function renderSections(sections, recipe) {
  if ((!sections || !sections.length) && (recipe.ingredients || recipe.instructions)) {
    sections = [];
    if (recipe.ingredients && recipe.ingredients.length) {
      sections.push({ type: 'heading', text: 'Ingredients' });
      sections.push({ type: 'ingredients', items: recipe.ingredients });
    }
    if (recipe.instructions && recipe.instructions.length) {
      sections.push({ type: 'heading', text: 'Instructions' });
      sections.push({ type: 'instructions', items: recipe.instructions });
    }
  }

  let stepCounter = 0;
  let slideshowCounter = 0;

  return sections.map(section => {
    if (section.type === 'paragraph') {
      return `<p class="post-paragraph">${escapeHtml(section.text || '')}</p>`;
    }
    if (section.type === 'heading') {
      return `<h2 class="post-section-heading">${escapeHtml(section.text || '')}</h2>`;
    }
    if (section.type === 'ingredients') {
      const items = (section.items || []).map(i => `<li>${escapeHtml(i)}</li>`).join('');
      return `<ul class="ingredients-list">${items}</ul>`;
    }
    if (section.type === 'instructions') {
      const items = (section.items || []).map(i => {
        stepCounter++;
        return `<li data-step="${stepCounter}">${escapeHtml(i)}</li>`;
      }).join('');
      return `<ol class="instructions-list">${items}</ol>`;
    }
    if (section.type === 'image') {
      const src = escapeAttr(section.src || '');
      const alt = escapeAttr(section.alt || section.caption || 'Recipe image');
      const caption = section.caption ? `<figcaption class="post-inline-image-caption">${escapeHtml(section.caption)}</figcaption>` : '';
      const sizeClass = section.size === 'small' ? ' size-small' : (section.size === 'wide' ? ' size-wide' : '');
      return `<figure class="post-inline-image${sizeClass}">
        <img src="${src}" alt="${alt}" loading="lazy">
        ${caption}
      </figure>`;
    }
    if (section.type === 'slideshow') {
      const photos = section.photos || [];
      if (photos.length === 0) return '';
      const ssId = 'ss-' + (slideshowCounter++);
      const sizeClass = section.size === 'wide' ? ' size-wide' : (section.size === 'small' ? ' size-small' : '');

      const slidesHtml = photos.map((p, i) => {
        const src = escapeAttr(p.src || '');
        const alt = escapeAttr(p.alt || p.caption || `Slide ${i + 1}`);
        const cap = p.caption ? `<figcaption class="slideshow-caption">${escapeHtml(p.caption)}</figcaption>` : '';
        return `<figure class="slideshow-slide${i === 0 ? ' active' : ''}" data-idx="${i}">
          <img src="${src}" alt="${alt}" loading="${i === 0 ? 'eager' : 'lazy'}">
          ${cap}
        </figure>`;
      }).join('');

      const dotsHtml = photos.map((_, i) =>
        `<button class="slideshow-dot${i === 0 ? ' active' : ''}" data-idx="${i}" onclick="goToSlide('${ssId}', ${i})" aria-label="Go to slide ${i + 1}"></button>`
      ).join('');

      return `<div class="slideshow${sizeClass}" id="${ssId}" data-current="0" data-count="${photos.length}">
        <div class="slideshow-frame">
          ${slidesHtml}
          <button class="slideshow-btn prev" onclick="navSlide('${ssId}', -1)" aria-label="Previous slide">‹</button>
          <button class="slideshow-btn next" onclick="navSlide('${ssId}', 1)" aria-label="Next slide">›</button>
          <div class="slideshow-counter"><span class="cur">1</span> / ${photos.length}</div>
        </div>
        <div class="slideshow-dots">${dotsHtml}</div>
      </div>`;
    }
    return '';
  }).join('');
}

// Slideshow navigation
function navSlide(id, dir) {
  const ss = document.getElementById(id);
  if (!ss) return;
  const count = parseInt(ss.dataset.count, 10);
  const cur = parseInt(ss.dataset.current, 10);
  const next = (cur + dir + count) % count;
  goToSlide(id, next);
}

function goToSlide(id, idx) {
  const ss = document.getElementById(id);
  if (!ss) return;
  ss.dataset.current = idx;
  ss.querySelectorAll('.slideshow-slide').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx, 10) === idx);
  });
  ss.querySelectorAll('.slideshow-dot').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx, 10) === idx);
  });
  const counter = ss.querySelector('.slideshow-counter .cur');
  if (counter) counter.textContent = idx + 1;
}

// Keyboard nav when slideshow is hovered
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const hovered = document.querySelector('.slideshow:hover');
  if (!hovered) return;
  navSlide(hovered.id, e.key === 'ArrowRight' ? 1 : -1);
});
</script>
